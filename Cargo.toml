[package]
name = "aidb"
version = "0.14.10"
edition = "2021"
description = "LSM-Tree based KV storage engine with optional cluster support"
license = "MIT OR Apache-2.0"

[features]
default = ["backup"]
backup = ["dep:ring", "dep:hex", "dep:serde_json"]
compression = ["dep:snap", "dep:lz4"]
cluster = [
  "dep:tonic",
  "dep:prost",
  "dep:tokio",
  "dep:tokio-stream",
  "dep:openraft",
  "dep:openraft-rt-tokio",
  "dep:rmp-serde",
  "dep:async-trait",
  "dep:futures-util",
]
monitoring = ["dep:opentelemetry", "dep:opentelemetry_sdk"]
cluster-test-util = ["cluster"]

[dependencies]
# Core primitives
bytes = "1"
thiserror = "2"
tracing = "0.1"
crc32fast = "1"
log = "0.4"

# Concurrency
parking_lot = "0.12"
crossbeam = "0.8"
crossbeam-channel = "0.5"
dashmap = "6"
crossbeam-skiplist = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
bincode = "1"

# File locking
fs2 = "0.4"

# Fast hashing (for cache shard index, etc.)
rustc-hash = "2"

# Backup feature (optional)
ring = { version = "0.17", optional = true }
hex = { version = "0.4", optional = true }
serde_json = { version = "1", optional = true }

# Compression (optional)
snap = { version = "1", optional = true }
lz4 = { version = "1", optional = true }

# Monitoring feature (optional)
opentelemetry = { version = "0.32", optional = true }
opentelemetry_sdk = { version = "0.32", optional = true, features = ["testing"] }

# Cluster feature (optional)
tonic   = { version = "0.11", optional = true }
prost   = { version = "0.12", optional = true }
tokio   = { version = "1",    features = ["full"], optional = true }
openraft = { version = "0.10.0-alpha.31", features = ["type-alias", "serde"], optional = true }
openraft-rt-tokio = { version = "0.10.0-alpha.31", optional = true }
rmp-serde = { version = "1", optional = true }
async-trait = { version = "0.1", optional = true }
tokio-stream = { version = "0.1", features = ["net"], optional = true }
futures-util = { version = "0.3", optional = true }

[build-dependencies]
tonic-build = "0.11"
prost-build = "0.12"

[dev-dependencies]
ctor = "0.2"
serial_test = "3"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "test-util"] }
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.8"
proptest = "1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "fmt"] }

[[bench]]
name = "write_bench"
harness = false

[[bench]]
name = "read_bench"
harness = false

[[bench]]
name = "backup_bench"
harness = false

[profile.release]
lto            = true
codegen-units  = 1

[lints.clippy]
all = "warn"

