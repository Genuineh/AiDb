[package]
name = "aidb"
version = "0.1.0"
edition = "2021"
authors = ["AiDb Contributors"]
description = "A high-performance LSM-Tree based key-value storage engine written in Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourusername/aidb"
keywords = ["database", "storage", "lsm-tree", "kv-store", "rocksdb"]
categories = ["database-implementations", "data-structures"]

[dependencies]
# Serialization
bytes = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Checksums and hashing
crc32fast = "1.4"

# Concurrency
parking_lot = "0.12"
crossbeam = "0.8"
crossbeam-skiplist = "0.1"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Compression (optional, enable via features)
snap = { version = "1.1", optional = true }
lz4 = { version = "1.24", optional = true }

# Logging
log = "0.4"
env_logger = "0.11"

# Filesystem utilities
walkdir = "2.4"

# RPC/gRPC (optional, for cluster mode)
tonic = { version = "0.11", optional = true }
prost = { version = "0.12", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tower = { version = "0.4", optional = true }
tokio-stream = { version = "0.1", optional = true }

# Raft consensus (optional, for raft-based cluster) - using openraft
openraft = { version = "0.9", features = ["serde"], optional = true }
async-trait = { version = "0.1", optional = true }

# Metrics and monitoring (optional, for monitoring features)
prometheus = { version = "0.14", optional = true }
lazy_static = { version = "1.4", optional = true }
hyper = { version = "1.5", features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }

# CLI (optional, for admin tool)
clap = { version = "4.5", features = ["derive"], optional = true }
comfy-table = { version = "7.1", optional = true }
indicatif = { version = "0.17", optional = true }
chrono = { version = "0.4", optional = true }

[dev-dependencies]
# Testing
tempfile = "3.8"
rand = "0.9"
proptest = "1.4"

# RPC testing
tonic = "0.11"
prost = "0.12"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tokio-stream = "0.1"

# Benchmarking
criterion = { version = "0.7", features = ["html_reports"] }

[build-dependencies]
tonic-build = "0.11"
# Protobuf compiler for tonic-build (to avoid system dependency)
protobuf-src = "1.1"

[features]
default = ["snappy"]
snappy = ["snap"]
lz4-compression = ["lz4"]
cluster = ["tonic", "prost", "tokio", "tower", "tokio-stream"]
raft-cluster = ["cluster", "openraft", "async-trait"]
monitoring = ["prometheus", "lazy_static", "hyper", "hyper-util", "http-body-util", "tokio"]
admin-cli = ["clap", "comfy-table", "indicatif", "chrono", "tokio"]

[[bench]]
name = "write_bench"
harness = false

[[bench]]
name = "read_bench"
harness = false

# Cluster examples (require --features cluster)
[[example]]
name = "primary_node"
path = "examples/cluster/primary_node.rs"
required-features = ["cluster"]

[[example]]
name = "replica_node"
path = "examples/cluster/replica_node.rs"
required-features = ["cluster"]

[[example]]
name = "rpc_client"
path = "examples/cluster/rpc_client.rs"
required-features = ["cluster"]

[[example]]
name = "coordinator_demo"
path = "examples/cluster/coordinator_demo.rs"
required-features = ["cluster"]

[[example]]
name = "peer_to_peer_demo"
path = "examples/cluster/peer_to_peer_demo.rs"
required-features = ["cluster"]

[[example]]
name = "raft_cluster_demo"
path = "examples/cluster/raft_cluster_demo.rs"
required-features = ["raft-cluster"]

[[example]]
name = "raft_peer_cluster"
path = "examples/cluster/raft_peer_cluster.rs"
required-features = ["raft-cluster"]

[[example]]
name = "raft_integration_test"
path = "examples/cluster/raft_integration_test.rs"
required-features = ["raft-cluster"]

# Monitoring examples (require --features monitoring)
[[example]]
name = "metrics_server"
path = "examples/monitoring/metrics_server.rs"
required-features = ["monitoring"]

# Admin tool binary (require --features admin-cli)
[[bin]]
name = "aidb-admin"
path = "src/bin/aidb-admin.rs"
required-features = ["admin-cli"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.bench]
inherits = "release"
