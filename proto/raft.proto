syntax = "proto3";

package aidb.raft;

service RaftService {
  rpc Vote(VoteRequest) returns (VoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
  rpc InstallSnapshot(InstallSnapshotRequest) returns (InstallSnapshotResponse);
  rpc GetKey(GetKeyRequest) returns (GetKeyResponse);
  rpc GetMigrationTip(GetMigrationTipRequest) returns (GetMigrationTipResponse);
  rpc GetMigrationTombstone(GetMigrationTombstoneRequest) returns (GetMigrationTombstoneResponse);
}

message VoteRequest {
  uint64 group_id = 1;
  uint64 vote_term = 2;
  uint64 vote_node_id = 3;
  bool vote_committed = 4;
  uint64 last_log_index = 5;
  uint64 last_log_term = 6;
  uint64 last_log_leader_id = 7;
}

message VoteResponse {
  uint64 vote_term = 1;
  uint64 vote_node_id = 2;
  bool vote_committed = 3;
  bool vote_granted = 4;
  bool is_in_membership = 5;
}

message LogEntry {
  uint64 log_index = 1;
  uint64 log_term = 2;
  uint64 log_leader_id = 3;
  bytes payload = 4;
  bool is_blank = 5;
  bool is_membership = 6;
}

message AppendEntriesRequest {
  uint64 group_id = 1;
  uint64 vote_term = 2;
  uint64 vote_node_id = 3;
  bool vote_committed = 4;
  optional uint64 prev_log_index = 5;
  optional uint64 prev_log_term = 6;
  optional uint64 prev_log_leader_id = 7;
  repeated LogEntry entries = 8;
  optional uint64 leader_commit_index = 9;
  optional uint64 leader_commit_term = 10;
  optional uint64 leader_commit_leader_id = 11;
}

message AppendEntriesResponse {
  uint64 vote_term = 1;
  uint64 vote_node_id = 2;
  bool vote_committed = 3;
  bool success = 4;
  optional uint64 conflict_index = 5;
  optional uint64 conflict_term = 6;
}

message InstallSnapshotRequest {
  uint64 group_id = 1;
  uint64 vote_term = 2;
  uint64 vote_node_id = 3;
  bool vote_committed = 4;
  SnapshotMeta meta = 5;
  bytes snapshot_data = 6;
}

message SnapshotMeta {
  optional uint64 last_log_index = 1;
  optional uint64 last_log_term = 2;
  optional uint64 last_log_leader_id = 3;
  bytes last_membership = 4;
  string snapshot_id = 5;
}

message InstallSnapshotResponse {
  uint64 vote_term = 1;
  uint64 vote_node_id = 2;
  bool vote_committed = 3;
}

// FIX-0056-A1: 跨节点合并读 / tip 读取的薄 RPC — 与 Vote/AppendEntries 同一
// 数据面 gRPC 通道, 目标为 group leader.
message GetKeyRequest {
  uint64 group_id = 1;
  bytes key = 2;
}

message GetKeyResponse {
  bool found = 1;
  bytes value = 2;
}

message GetMigrationTipRequest {
  uint64 group_id = 1;
  uint64 epoch = 2;
}

message GetMigrationTipResponse {
  uint64 tip = 1;
}

// FIX-0056-A1: 合并读线性点第 1 步 —— 查询 target group 上 `epoch` 内某 key
// 最后一次的迁移 tombstone (Put/Del), 供 aikv 合并读判断"target miss 是从未
// 拷贝还是已被客户端 Del"; op_tag: 0=无 tombstone, 1=Put, 2=Del.
message GetMigrationTombstoneRequest {
  uint64 group_id = 1;
  uint64 epoch = 2;
  bytes key = 3;
}

message GetMigrationTombstoneResponse {
  uint32 op_tag = 1;
}
