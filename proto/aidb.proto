syntax = "proto3";

package aidb;

// Storage service for AiDb RPC interface
service Storage {
  // Basic key-value operations
  rpc Get(GetRequest) returns (GetResponse);
  rpc Put(PutRequest) returns (PutResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  
  // Batch operations
  rpc BatchGet(BatchGetRequest) returns (BatchGetResponse);
  rpc Write(WriteRequest) returns (WriteResponse);
  
  // Range operations
  rpc Scan(ScanRequest) returns (stream ScanResponse);
  
  // Health check
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
  
  // Statistics
  rpc GetStats(GetStatsRequest) returns (GetStatsResponse);
}

// Get operation
message GetRequest {
  bytes key = 1;
}

message GetResponse {
  bool found = 1;
  bytes value = 2;
}

// Put operation
message PutRequest {
  bytes key = 1;
  bytes value = 2;
}

message PutResponse {
  bool success = 1;
  string error = 2;
}

// Delete operation
message DeleteRequest {
  bytes key = 1;
}

message DeleteResponse {
  bool success = 1;
  string error = 2;
}

// Batch get operation
message BatchGetRequest {
  repeated bytes keys = 1;
}

message KeyValue {
  bytes key = 1;
  bool found = 2;
  bytes value = 3;
}

message BatchGetResponse {
  repeated KeyValue results = 1;
}

// Write batch operation
message WriteOp {
  enum OpType {
    PUT = 0;
    DELETE = 1;
  }
  
  OpType op_type = 1;
  bytes key = 2;
  bytes value = 3;
}

message WriteRequest {
  repeated WriteOp operations = 1;
}

message WriteResponse {
  bool success = 1;
  string error = 2;
}

// Scan operation
message ScanRequest {
  bytes start_key = 1;
  bytes end_key = 2;
  uint32 limit = 3;
}

message ScanResponse {
  bytes key = 1;
  bytes value = 2;
}

// Health check
message HealthCheckRequest {
  string service = 1;
}

message HealthCheckResponse {
  enum ServingStatus {
    UNKNOWN = 0;
    SERVING = 1;
    NOT_SERVING = 2;
  }
  
  ServingStatus status = 1;
}

// Statistics
message GetStatsRequest {
  // Empty for now
}

message GetStatsResponse {
  uint64 total_keys = 1;
  uint64 total_size = 2;
  uint64 memtable_size = 3;
  uint32 num_sstables = 4;
  CacheStats cache_stats = 5;
}

message CacheStats {
  uint64 hits = 1;
  uint64 misses = 2;
  uint64 total_requests = 3;
  double hit_rate = 4;
}
