[advisories]
ignore = ["RUSTSEC-2025-0141"]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "ISC",
  "BSD-3-Clause",
  "BSD-2-Clause",
  "Unicode-3.0",
  "Unicode-DFS-2016",
]

[bans]
multiple-versions = "deny"
skip = [
  # ring v0.17 依赖 getrandom 0.2, 项目已有 getrandom 0.3
  { name = "getrandom" },
  # ring v0.17 依赖 windows-sys 0.52, 项目已有 windows-sys 0.61
  { name = "windows-sys" },
]

[sources]
allow-git = []
