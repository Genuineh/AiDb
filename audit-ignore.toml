# Cargo audit ignore file
# This file contains security advisories that we've acknowledged but chosen not to fix immediately

# RUSTSEC-2024-0437: Crash due to uncontrolled recursion in protobuf crate
# Status: Acknowledged - Waiting for raft-rs to update to protobuf 3.x
# Context: The raft crate (0.7.0) from TiKV depends on protobuf 2.28.0 which has this vulnerability.
#          However, there's no newer version of raft-rs that uses protobuf 3.x yet.
# Impact: Low - The vulnerability requires maliciously crafted protobuf messages to trigger DoS.
#         In our use case, Raft messages are internal to the cluster and not exposed to untrusted input.
# Mitigation: 
#   - Raft messages are only accepted from authenticated cluster peers
#   - Input validation and rate limiting are in place
#   - Monitoring for unusual CPU/memory patterns
# Plan: Upgrade to raft 0.8+ when available, or contribute a PR to raft-rs to update protobuf
[advisories]
ignore = [
    "RUSTSEC-2024-0437",  # protobuf uncontrolled recursion - acknowledged, waiting for raft-rs update
]

# RUSTSEC-2025-0057: fxhash - no longer maintained
# Status: Acknowledged - Transitive dependency from raft
# Context: fxhash 0.2.1 is a transitive dependency from raft crate
# Impact: Low - fxhash is a simple hash function, low risk of critical issues
# Plan: Will be resolved when raft-rs updates its dependencies
[advisories.unmaintained]
ignore = [
    "RUSTSEC-2025-0057",   # fxhash unmaintained - transitive from raft
]

# RUSTSEC-2025-0119: number_prefix - unmaintained
# Status: Acknowledged - Transitive dependency from indicatif
# Context: number_prefix is used by indicatif for CLI progress bars (dev/optional feature)
# Impact: Very Low - Only used in CLI tool (optional feature), not in core library
# Plan: Consider alternative progress bar library or wait for indicatif update
[advisories.unmaintained]
ignore = [
    "RUSTSEC-2025-0119",  # number_prefix unmaintained - transitive from indicatif (CLI only)
]
