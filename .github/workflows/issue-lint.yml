name: issue-lint
on:
  pull_request:
    types: [opened, edited]

jobs:
  check-issue-link:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Check PR body for issue link
        id: check
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if echo "$PR_BODY" | grep -qiE '(closes|fixes|resolves|related)\s+#[0-9]+'; then
            echo "linked=true" >> "$GITHUB_OUTPUT"
          else
            echo "linked=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Comment reminder
        if: steps.check.outputs.linked == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: existing } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const already = existing.some(c => c.body.includes('请关联一个 GitHub Issue'));
            if (!already) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `请关联一个 GitHub Issue 便于追溯。在 PR 描述中加入 \`Closes #<issue-number>\` 或 \`Related #<issue-number>\`。`,
              });
            }
