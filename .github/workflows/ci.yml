name: CI

on:
  push:
    branches: [main, new/main, new/wiqun]
  pull_request:
    branches: [main, new/main, new/wiqun]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test-default:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt

      - name: Check format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets

      - name: Test
        run: cargo test -- --test-threads=1

  test-cluster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Clippy cluster
        run: cargo clippy --all-targets --features cluster

      - name: Test cluster
        run: cargo test --features cluster -- --test-threads=1

  bench:
    runs-on: ubuntu-latest
    needs: test-default
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Bench
        run: |
          cargo bench --bench write_bench
          cargo bench --bench read_bench
          cargo bench --bench backup_bench
