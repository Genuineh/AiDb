name: Performance
description: "Performance optimization or a performance issue (commit type: perf)"
labels: ["perf"]
title: "[perf] Summary"
body:
  - type: textarea
    id: scenario
    attributes:
      label: Scenario / Current state
      description: The measured scenario and current performance data (benchmark / stress results)
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Target
      description: Desired performance metric (throughput / latency / memory, etc.)
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: Approach
      description: Identified bottleneck and the proposed optimization
  - type: textarea
    id: verification
    attributes:
      label: How it was verified
      description: How to measure and compare (criterion bench / stress script)
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Related discussion, reference implementations
