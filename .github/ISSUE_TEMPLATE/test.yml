name: Test
description: "Add or improve tests (commit type: test)"
labels: ["test"]
title: "[test] Summary"
body:
  - type: textarea
    id: target
    attributes:
      label: Test target
      description: The module / behavior / regression being tested
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: Test plan
      description: Cases and assertions to cover (see L1-L4 layering in CONTRIBUTING.md)
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Related issues, reproducers, reference tests
